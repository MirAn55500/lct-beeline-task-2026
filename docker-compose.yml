services:
  db:
    image: postgres:16-alpine
    container_name: lct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lct}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lct}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - local-db
    networks:
      - lct

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # planner и его справочники лежат вне backend/ — см. COPY --from=solution
      additional_contexts:
        solution: ./solution
    container_name: lct-backend
    restart: unless-stopped
    environment:
      # Собирается в workflow / .env (пароль URL-encoded) — не интерполировать сырым
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}
      # Сервис ors ниже. Пустое значение — только кэш маршрутов, без кэша — координаты
      ORS_URL: ${ORS_URL-http://ors:8082/ors}
      # Кэш ответов ORS переживает пересборку образа; при первом старте берётся из образа
      ROUTING_CACHE_PATH: /cache/routing_cache.json
      # Геокодирование новых адресов: DaData, при промахе — Photon/Nominatim (OSM)
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY:-}
      GEOCODER_OSM_ENABLED: ${GEOCODER_OSM_ENABLED:-true}
      GEOCODER_TIMEOUT: ${GEOCODER_TIMEOUT:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - routing-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - lct

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lct-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - lct

  # Готовит volume ORS: выгрузка OSM (один раз, ~0.9 ГБ), GTFS и конфиг из solution/deploy/ors
  ors-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    entrypoint: ["sh", "/src/init.sh"]
    environment:
      OSM_REGION: ${ORS_OSM_REGION:-central}
    volumes:
      - ./solution/deploy/ors:/src:ro
      - ors-data:/home/ors
    profiles:
      - ors

  # openrouteservice: расстояния по улицам и транспорту для планировщика.
  # Первая сборка графов идёт 30-45 минут — backend всё это время работает на кэше.
  ors:
    image: openrouteservice/openrouteservice:v10.0.0
    container_name: lct-ors
    restart: unless-stopped
    depends_on:
      ors-init:
        condition: service_completed_successfully
    ports:
      # Для tools/ors_check.py и прогрева кэша с хоста; наружу не открываем
      - "127.0.0.1:${ORS_PORT:-8081}:8082"
    volumes:
      - ors-data:/home/ors
    environment:
      REBUILD_GRAPHS: "False"
      CONTAINER_LOG_LEVEL: INFO
      # Правило ORS: <размер pbf> × <число профилей> × 2 — для ЦФО минимум 6 ГБ
      XMS: ${ORS_XMS:-4g}
      XMX: ${ORS_XMX:-10g}
      # Экономный режим для машины с 3-4 ГБ RAM: графы читаются с диска (MMAP), а не
      # держатся в heap; без общественного транспорта — backend его у ORS не запрашивает
      ors.engine.graphs_data_access: ${ORS_GRAPHS_DATA_ACCESS:-RAM_STORE}
      ors.engine.profiles.public-transport.enabled: ${ORS_TRANSIT:-true}
    # Потолок памяти вместе с кэшем страниц графов: при нехватке ядро ужимает ORS,
    # а не backend; oom_score_adj — чтобы и при общей нехватке первым падал ORS
    mem_limit: ${ORS_MEM_LIMIT:-16g}
    oom_score_adj: 500
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8082/ors/v2/health || exit 1
      start_period: 45m
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - ors
    networks:
      - lct

volumes:
  pgdata:
  routing-cache:
  ors-data:

networks:
  lct:
    name: lct-net
