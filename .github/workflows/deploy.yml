name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "solution/planner/**"
      - "solution/data/*.json"
      - "solution/deploy/ors/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy app
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          DEBUG: ${{ vars.DEBUG }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          ORS_URL: ${{ vars.ORS_URL }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          TRANSIT_WORKERS: ${{ vars.TRANSIT_WORKERS }}
          ORS_XMS: ${{ vars.ORS_XMS }}
          ORS_XMX: ${{ vars.ORS_XMX }}
          ORS_GRAPHS_DATA_ACCESS: ${{ vars.ORS_GRAPHS_DATA_ACCESS }}
          ORS_TRANSIT: ${{ vars.ORS_TRANSIT }}
          ORS_MEM_LIMIT: ${{ vars.ORS_MEM_LIMIT }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
          DADATA_SECRET_KEY: ${{ secrets.DADATA_SECRET_KEY }}
          GEOCODER_OSM_ENABLED: ${{ vars.GEOCODER_OSM_ENABLED }}
        run: |
          set -e
          missing=
          [ -n "$POSTGRES_USER" ] || missing="$missing POSTGRES_USER"
          [ -n "$POSTGRES_PASSWORD" ] || missing="$missing POSTGRES_PASSWORD"
          [ -n "$POSTGRES_DB" ] || missing="$missing POSTGRES_DB"
          [ -n "$POSTGRES_HOST" ] || missing="$missing POSTGRES_HOST"
          if [ -n "$missing" ]; then
            echo "Missing required settings:$missing"
            echo "Need vars POSTGRES_USER/DB/HOST/PORT and secret POSTGRES_PASSWORD."
            exit 1
          fi

          echo "Postgres host=${POSTGRES_HOST} port=${POSTGRES_PORT:-5432} db=${POSTGRES_DB} user=${POSTGRES_USER}"

          # Пароль/логин URL-encode, иначе @ : / в пароле ломают host и дают gaierror
          umask 077
          python3 - <<'PY'
          import os
          from urllib.parse import quote

          user = os.environ["POSTGRES_USER"]
          password = os.environ["POSTGRES_PASSWORD"]
          host = os.environ["POSTGRES_HOST"].strip().strip('"').strip("'")
          port = os.environ.get("POSTGRES_PORT") or "5432"
          db = os.environ["POSTGRES_DB"]
          debug = os.environ.get("DEBUG") or "false"
          backend_port = os.environ.get("BACKEND_PORT") or "8000"
          frontend_port = os.environ.get("FRONTEND_PORT") or "8080"
          cors = os.environ.get("CORS_ORIGINS") or '["http://localhost:8080"]'
          ors_url = os.environ.get("ORS_URL") or "http://ors:8082/ors"
          ors_api_key = os.environ.get("ORS_API_KEY") or ""
          # ORS на отдельной машине — основной, свой на стенде остаётся запасным
          local_ors = "http://ors:8082/ors"
          ors_fallback = local_ors if ors_url != local_ors else ""
          transit_workers = os.environ.get("TRANSIT_WORKERS") or "2"
          # По умолчанию — экономный режим стенда (3-4 ГБ RAM): графы с диска, heap 1 ГБ,
          # потолок контейнера 2 ГБ, без общественного транспорта. Графы заливаются
          # готовыми (solution/deploy/ors/upload-graphs.sh), собрать их тут не хватит памяти
          ors_xms = os.environ.get("ORS_XMS") or "512m"
          ors_xmx = os.environ.get("ORS_XMX") or "1g"
          ors_data_access = os.environ.get("ORS_GRAPHS_DATA_ACCESS") or "MMAP"
          ors_transit = os.environ.get("ORS_TRANSIT") or "false"
          ors_mem_limit = os.environ.get("ORS_MEM_LIMIT") or "2g"
          dadata_key = os.environ.get("DADATA_API_KEY") or ""
          dadata_secret = os.environ.get("DADATA_SECRET_KEY") or ""
          osm_geocoder = os.environ.get("GEOCODER_OSM_ENABLED") or "true"
          if not dadata_key:
              print("DADATA_API_KEY не задан — геокодирование только через кэш и OSM")

          database_url = (
              "postgresql+asyncpg://"
              f"{quote(user, safe='')}:{quote(password, safe='')}@"
              f"{host}:{port}/{db}"
          )

          # Одинарные кавычки: compose берёт значение как есть — не интерполирует $
          # (в двойных "abc$7def" превращается в "abcdef") и не трогает %. Поэтому
          # % не удваиваем: %% дошёл бы до backend и сломал пароль. Для configparser
          # alembic % экранирует сам (backend/alembic/env.py)
          def q(name: str, value: str) -> str:
              if "'" in value or "\n" in value:
                  raise SystemExit(f"{name}: одинарная кавычка/перевод строки не поддерживаются")
              return f"{name}='{value}'"

          lines = [
              q("DATABASE_URL", database_url),
              q("POSTGRES_USER", user),
              q("POSTGRES_PASSWORD", password),
              q("POSTGRES_DB", db),
              q("POSTGRES_HOST", host),
              q("POSTGRES_PORT", port),
              q("DEBUG", debug),
              q("BACKEND_PORT", backend_port),
              q("FRONTEND_PORT", frontend_port),
              q("CORS_ORIGINS", cors),
              q("ORS_URL", ors_url),
              q("ORS_API_KEY", ors_api_key),
              q("ORS_FALLBACK_URL", ors_fallback),
              q("TRANSIT_WORKERS", transit_workers),
              q("ORS_XMS", ors_xms),
              q("ORS_XMX", ors_xmx),
              q("ORS_GRAPHS_DATA_ACCESS", ors_data_access),
              q("ORS_TRANSIT", ors_transit),
              q("ORS_MEM_LIMIT", ors_mem_limit),
              q("DADATA_API_KEY", dadata_key),
              q("DADATA_SECRET_KEY", dadata_secret),
              q("GEOCODER_OSM_ENABLED", osm_geocoder),
          ]
          with open(".env", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

          # Переменные шага (в т.ч. незаданные vars — пустыми строками) для compose
          # важнее .env: пустой ORS_XMX давал дефолт 10g, пустой ORS_URL выключал ORS.
          # Источник правды — .env, поэтому все его ключи из окружения убираются
          db_host="$POSTGRES_HOST"
          frontend_port="${FRONTEND_PORT:-8080}"
          backend_port="${BACKEND_PORT:-8000}"
          unset $(sed -n 's/=.*//p' .env)

          # При падении показать, почему backend не поднялся
          trap 'docker compose ps -a; docker compose logs --tail=100 backend db || true' ERR

          # db в профиле local-db и сам не стартует — без него хост "db" не резолвится
          if [ "$db_host" = "db" ]; then
            docker compose --profile local-db up -d --wait db
          fi

          docker compose up -d --build backend frontend
          docker compose ps
          docker compose logs --tail=80 backend
          curl -fsS "http://127.0.0.1:${frontend_port}/api/catalogs/health"
          echo
          curl -fsS "http://127.0.0.1:${backend_port}/health"
          echo

          # ORS после приложения; ждать его не нужно — до готовности backend считает на
          # кэше маршрутов. Графы на стенде заливаются готовыми (upload-graphs.sh).
          # При ORS_URL на отдельную машину (solution/deploy/ors/REMOTE.md) этот —
          # запасной: авто, пешком и велосипед, если основной не отвечает
          docker compose --profile ors up -d ors
          docker compose --profile ors ps ors
