name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          DEBUG: ${{ vars.DEBUG }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "Set repository secret DATABASE_URL (same remote Postgres as local)."
            exit 1
          fi
          docker compose up -d --build backend frontend
          docker compose ps
          docker compose logs --tail=80 backend
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT:-8080}/api/catalogs/health"
          echo
          curl -fsS "http://127.0.0.1:${BACKEND_PORT:-8000}/health"
          echo
