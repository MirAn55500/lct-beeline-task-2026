name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy app
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          DEBUG: ${{ vars.DEBUG }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -e
          missing=
          [ -n "$POSTGRES_USER" ] || missing="$missing POSTGRES_USER"
          [ -n "$POSTGRES_PASSWORD" ] || missing="$missing POSTGRES_PASSWORD"
          [ -n "$POSTGRES_DB" ] || missing="$missing POSTGRES_DB"
          [ -n "$POSTGRES_HOST" ] || missing="$missing POSTGRES_HOST"
          if [ -n "$missing" ]; then
            echo "Missing required settings:$missing"
            echo "Need vars POSTGRES_USER/DB/HOST/PORT and secret POSTGRES_PASSWORD."
            exit 1
          fi

          # docker compose читает .env из корня проекта; GitHub vars живут только в этом шаге
          umask 077
          {
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST"
            printf 'POSTGRES_PORT=%s\n' "${POSTGRES_PORT:-5432}"
            printf 'DEBUG=%s\n' "${DEBUG:-false}"
            printf 'BACKEND_PORT=%s\n' "${BACKEND_PORT:-8000}"
            printf 'FRONTEND_PORT=%s\n' "${FRONTEND_PORT:-8080}"
            printf 'CORS_ORIGINS=%s\n' "${CORS_ORIGINS:-[\"http://localhost:8080\"]}"
          } > .env

          docker compose up -d --build backend frontend
          docker compose ps
          docker compose logs --tail=80 backend
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT:-8080}/api/catalogs/health"
          echo
          curl -fsS "http://127.0.0.1:${BACKEND_PORT:-8000}/health"
          echo
