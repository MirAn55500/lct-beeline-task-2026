name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy app
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          DEBUG: ${{ vars.DEBUG }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -e
          missing=
          [ -n "$POSTGRES_USER" ] || missing="$missing POSTGRES_USER"
          [ -n "$POSTGRES_PASSWORD" ] || missing="$missing POSTGRES_PASSWORD"
          [ -n "$POSTGRES_DB" ] || missing="$missing POSTGRES_DB"
          [ -n "$POSTGRES_HOST" ] || missing="$missing POSTGRES_HOST"
          if [ -n "$missing" ]; then
            echo "Missing required settings:$missing"
            echo "Need vars POSTGRES_USER/DB/HOST/PORT and secret POSTGRES_PASSWORD."
            exit 1
          fi

          echo "Postgres host=${POSTGRES_HOST} port=${POSTGRES_PORT:-5432} db=${POSTGRES_DB} user=${POSTGRES_USER}"

          # Пароль/логин URL-encode, иначе @ : / в пароле ломают host и дают gaierror
          umask 077
          python3 - <<'PY'
          import os
          from urllib.parse import quote

          user = os.environ["POSTGRES_USER"]
          password = os.environ["POSTGRES_PASSWORD"]
          host = os.environ["POSTGRES_HOST"].strip().strip('"').strip("'")
          port = os.environ.get("POSTGRES_PORT") or "5432"
          db = os.environ["POSTGRES_DB"]
          debug = os.environ.get("DEBUG") or "false"
          backend_port = os.environ.get("BACKEND_PORT") or "8000"
          frontend_port = os.environ.get("FRONTEND_PORT") or "8080"
          cors = os.environ.get("CORS_ORIGINS") or '["http://localhost:8080"]'

          database_url = (
              "postgresql+asyncpg://"
              f"{quote(user, safe='')}:{quote(password, safe='')}@"
              f"{host}:{port}/{db}"
          )

          # Одинарные кавычки: compose не интерполирует $ внутри них
          # (в двойных "abc$7def" превращается в "abcdef").
          def q(name: str, value: str) -> str:
              if "'" in value or "\n" in value:
                  raise SystemExit(f"{name}: одинарная кавычка/перевод строки не поддерживаются")
              return f"{name}='{value}'"

          lines = [
              q("DATABASE_URL", database_url),
              q("POSTGRES_USER", user),
              q("POSTGRES_PASSWORD", password),
              q("POSTGRES_DB", db),
              q("POSTGRES_HOST", host),
              q("POSTGRES_PORT", port),
              q("DEBUG", debug),
              q("BACKEND_PORT", backend_port),
              q("FRONTEND_PORT", frontend_port),
              q("CORS_ORIGINS", cors),
          ]
          with open(".env", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

          # При падении показать, почему backend не поднялся
          trap 'docker compose ps -a; docker compose logs --tail=100 backend db || true' ERR

          # db в профиле local-db и сам не стартует — без него хост "db" не резолвится
          if [ "$POSTGRES_HOST" = "db" ]; then
            docker compose --profile local-db up -d --wait db
          fi

          docker compose up -d --build backend frontend
          docker compose ps
          docker compose logs --tail=80 backend
          curl -fsS "http://127.0.0.1:${FRONTEND_PORT:-8080}/api/catalogs/health"
          echo
          curl -fsS "http://127.0.0.1:${BACKEND_PORT:-8000}/health"
          echo
