[pytest]
# Локальный конфиг сьюта тестов planner. Намеренно лежит в solution/tests/,
# чтобы не трогать корень репозитория.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: тест выполняется дольше ~1 секунды (нагрузка, большие сценарии)
    realdata: тест читает реальные обезличенные CSV из каталога «Обезличивание»
    property: property-style тест на псевдослучайных сценариях с фиксированным seed
filterwarnings =
    default
