# Конфигурация openrouteservice под задачу планирования маршрутов инженеров.
# Полный список параметров: https://giscience.github.io/openrouteservice/run-instance/configuration/
#
# Включено ровно то, что нужно планировщику, и ничего сверх: каждый лишний профиль —
# это отдельный граф, десятки минут сборки и гигабайты памяти.

server:
  port: 8082

ors:
  endpoints:
    matrix:
      enabled: true
      # Ключевой параметр интеграции. По умолчанию 2500 пар на запрос, а у нас
      # ~100 точек (12 инженеров + 85 заявок) = ~10 000 пар на один профиль.
      # Планировщик умеет резать матрицу на блоки (planner/ors.py: fetch_matrix),
      # но одним запросом и быстрее, и проще читать в логах.
      maximum_routes: 25000
      # Запас по обходу графа. Набор охватывает и Москву, и Каширу в 100 км от неё,
      # а матрица считается «все со всеми» — включая заведомо абсурдные пары вроде
      # пешего перехода между ними. Дефолтного лимита на таких парах не хватает.
      #
      # Параметр действует именно здесь. Одноимённый ключ в profile_default.service
      # на матрицу НЕ влияет — проверено прямым замером: с ним и без него отказ
      # наступает на одном и том же размере блока. А снижение значения ниже ломает
      # даже запрос из одного источника, то есть работает ровно эта строка.
      maximum_visited_nodes: 10000000
      maximum_search_radius: 2000
    routing:
      enabled: true
    isochrones:
      enabled: false
    snap:
      enabled: true

  engine:
    # Профили собираются параллельно. Оперативная память при этом складывается,
    # поэтому значение согласовано с XMS/XMX в docker-compose.yml.
    init_threads: 3

    profile_default:
      graph_path: /home/ors/graphs
      build:
        # Выгрузка OSM. Скачивается скриптом download-osm.sh в ./files.
        source_file: /home/ors/files/region.osm.pbf
        # Рельеф выключен намеренно. Для равнинного Подмосковья он не меняет ни
        # время, ни расстояние, зато тянет внешние тайлы SRTM и ощутимо удлиняет
        # сборку графа. Для велосипеда в холмистом регионе имеет смысл включить.
        elevation: false
      service:
        # Геометрия запрашивается одним вызовом на маршрут; в маршруте инженера
        # редко больше 10 точек, 50 — с большим запасом.
        maximum_waypoints: 50
        # Дефолтные 100 км режут реальные маршруты: в юго-восточном наборе у
        # автомобильного инженера выходит 349 км за смену (Москва — Кашира — Москва),
        # и ORS отказывался строить линию для всего маршрута целиком. На расчёт
        # расстояний не влияет: матрица считается отдельным движком и своих лимитов
        # на длину не имеет.
        maximum_distance: 500000
        maximum_distance_dynamic_weights: 500000
        # Радиус привязки точки к дороге. Дефолт — 400 м, и он не совпадал с
        # maximum_search_radius матрицы (2000 м): расстояние до адреса считалось,
        # а линия до него не строилась, причём падал весь маршрут целиком. Значения
        # выровнены. Это страховка от неточного геокодирования, а не замена ему:
        # координата уровня улицы остаётся неточной, просто теперь она не роняет карту.
        maximum_snapping_radius: 2000

    profiles:
      # Справочник ТЗ п. 2.4.1 «Способ передвижения» → профили ORS.
      # Соответствие задано в planner/ors.py: DEFAULT_PROFILES.
      driving-car:            # автомобиль
        enabled: true
        encoder_name: driving-car
      # Пеший и велосипедный профили считают матрицу перебором (contraction hierarchies
      # для них ORS не использует), поэтому их запросы упираются в maximum_visited_nodes
      # выше. Включение CH здесь проверялось и на поведение матрицы не повлияло — размер
      # блока всё равно подбирается клиентом (planner/ors.py: fetch_matrix), поэтому
      # лишние 20 минут сборки графа не берутся.
      foot-walking:           # пешком
        enabled: true
        encoder_name: foot-walking
      cycling-regular:        # велосипед
        enabled: true
        encoder_name: cycling-regular

      # Общественный транспорт. Работает только с GTFS-фидом: без расписаний ORS
      # считает такой запрос обычной пешей доступностью, то есть даёт заведомо
      # неверное время. Фид собирается из выгрузок data.mos.ru скриптом
      # tools/mosdata_to_gtfs.py и проверяется tools/gtfs_check.py.
      #
      # Фид покрывает Москву и ТиНАО, но не область: Кашира и Ступино от ближайшей
      # обслуживаемой остановки в 70 км. Поэтому planner/ors.py отдаёт в этот профиль
      # только пары, где обе точки внутри покрытия, а остальные считает по
      # координатам — иначе ORS молча выдал бы на них пеший переход через полобласти.
      public-transport:
        enabled: true
        encoder_name: public-transport
        build:
          gtfs_file: /home/ors/files/gtfs.zip
        service:
          maximum_visited_nodes: 1000000

logging:
  level:
    org.heigit: INFO
