# openrouteservice для планировщика: расстояния по улицам и геометрия маршрутов.
#
#   cd solution/deploy/ors
#   ./download-osm.sh            # выгрузка OSM по региону (один раз, ~1 ГБ)
#   docker compose up -d         # первая сборка графов: 20-40 минут, дальше секунды
#   curl http://localhost:8081/ors/v2/health
#
# Наружу сервис смотрит на 8081 — это адрес по умолчанию в planner/ors.py
# (8080 занят фронтендом из корневого docker-compose.yml).
#
# Это запуск для локальной работы с графами в ./ors-docker. На сервере ORS для
# backend поднимает корневой docker-compose.yml (профиль ors) — одновременно
# с ним этот не запускать: совпадают имя контейнера и порт.
# Ключей API не требуется: инстанс свой, данные OSM, лицензия GPL-3.0/LGPL-3.0.

services:
  ors-app:
    image: openrouteservice/openrouteservice:v10.0.0
    container_name: lct-ors-local
    restart: unless-stopped
    ports:
      - "8081:8082"
    volumes:
      # Графы, кэш высот и логи остаются на хосте: пересборка при каждом старте
      # занимает десятки минут, а нам нужен старт за секунды.
      - ./ors-docker:/home/ors
      - ./ors-config.yml:/home/ors/config/ors-config.yml:ro
      - ./files:/home/ors/files
    environment:
      REBUILD_GRAPHS: "False"   # True — только после смены выгрузки OSM или профилей
      CONTAINER_LOG_LEVEL: INFO
      # Правило из документации ORS: <размер pbf> × <число профилей> × 2.
      # ЦФО (~0.9 ГБ) и три профиля → минимум 6 ГБ. Профили собираются параллельно
      # (ors.engine.init_threads: 3), поэтому взято с запасом.
      XMS: 4g
      XMX: 10g
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8082/ors/v2/health || exit 1
      start_period: 45m         # первая сборка графов длится долго и это норма
      interval: 30s
      timeout: 5s
      retries: 3
